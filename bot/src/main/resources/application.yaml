app:
  telegram-token: ${TELEGRAM_TOKEN}

scrapper:
  base-url: http://localhost:8081

bot:
  base-url: http://localhost:8080

spring:
  application:
    name: DMLinkUpdateBot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
